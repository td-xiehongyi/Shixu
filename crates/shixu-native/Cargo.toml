[package]
name = "shixu-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
shixu-core = { path = "../shixu-core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
serde_json.workspace = true
uuid.workspace = true
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
