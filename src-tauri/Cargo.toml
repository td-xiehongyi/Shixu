[package]
name = "shixu-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
shixu-core = { path = "../crates/shixu-core" }
serde.workspace = true
serde_json.workspace = true
zeroize = { workspace = true, features = ["serde"] }

[target.'cfg(windows)'.dependencies]
shixu-native = { path = "../crates/shixu-native" }
tauri = { version = "=2.12.2", default-features = false, features = ["wry", "compression", "common-controls-v6", "tray-icon"] }

[target.'cfg(windows)'.build-dependencies]
tauri-build = "=2.7.1"
