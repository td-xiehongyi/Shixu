[package]
name = "shixu-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
shixu-native = { path = "../crates/shixu-native" }
shixu-core = { path = "../crates/shixu-core" }
serde.workspace = true
serde_json.workspace = true
zeroize = { workspace = true, features = ["serde"] }
sha2 = "=0.11.0"

[build-dependencies]
sha2 = "=0.11.0"

[target.'cfg(windows)'.dependencies]
tauri = { version = "=2.12.2", default-features = false, features = ["wry", "compression", "common-controls-v6", "tray-icon"] }

[target.'cfg(windows)'.build-dependencies]
tauri-build = "=2.7.1"

[dev-dependencies]
tauri-utils = { version = "=2.10.1", features = ["resources"] }
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
